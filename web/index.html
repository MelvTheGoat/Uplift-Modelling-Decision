<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Who should get the email?</title>
    <meta
      name="description"
      content="A plain-English walk through a real randomised email campaign: did it
      work, can we pick who to send it to, and what is that worth?"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%AC%3C/text%3E%3C/svg%3E"
    />
    <!-- The theme is applied before first paint so a dark-mode visitor never
         sees a white flash. Inline because an external file would be a second
         round trip, and this has to run before the body renders. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.dataset.theme = saved;
            return;
          }
        } catch (err) {
          /* private browsing, blocked storage: fall through to the OS setting */
        }
        document.documentElement.removeAttribute("data-theme");
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="shell">
      <header class="topbar">
        <button class="icon-button" id="nav-toggle" aria-expanded="false" aria-controls="sidebar">
          ☰ Contents
        </button>
        <strong>Who should get the email?</strong>
      </header>

      <nav class="sidebar" id="sidebar" aria-label="Sections">
        <a class="brand" href="#/">Who should get the email?</a>
        <p class="brand-sub">
          A real randomised campaign, worked through in plain English.
        </p>
        <div class="nav" id="nav"></div>
        <dl class="glossary" id="glossary"></dl>
        <button class="icon-button theme-toggle" id="theme-toggle">Switch theme</button>
      </nav>

      <main class="main" id="main">
        <div class="content" id="view">
          <div class="loading">Loading the findings…</div>
        </div>
      </main>
    </div>

    <div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
