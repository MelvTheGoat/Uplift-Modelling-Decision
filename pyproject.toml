[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uplift-targeting"
version = "1.0.0"
description = "Uplift modelling / causal inference study: who should receive the campaign under a fixed budget?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=2.0,<2.3",  # np.trapezoid; 1.x only has np.trapz
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "econml>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.8",
    "pandas-stubs",
]

[project.scripts]
uplift = "src.cli:main"

[tool.setuptools]
packages = ["src"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py310"
# Markdown is excluded because ruff formats fenced Python blocks inside it, and
# the prose files quote real source verbatim — reformatting those quotes makes
# them stop matching the files they cite.
extend-exclude = [".venv", "*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "ARG",  # unused arguments
    "PTH",  # pathlib
    "RET",  # returns
    "D",    # pydocstyle
    "ANN",  # annotations
    "NPY",  # numpy
]
ignore = [
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "D107",    # constructor arguments are documented on the class, per Google style
    "ANN401",  # Any is deliberate in a couple of dict payloads
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "D100"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
exclude = "\\.venv"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "lightgbm.*",
    "econml.*",
    "scipy.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that fit many models (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]
