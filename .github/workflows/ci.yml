name: CI

# Present as a file, as specified. Nothing here downloads the Hillstrom dataset:
# the test suite runs entirely on synthetic data, so CI stays fast and does not
# depend on a third-party host staying up.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types and tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy, strict)
        run: mypy

      - name: Tests (synthetic data only)
        run: pytest -q --durations=10

  smoke:
    name: end-to-end smoke run
    runs-on: ubuntu-latest
    # Exercises the CLI stages that need no network access, so a broken pipeline
    # is caught even though the real dataset is not fetched in CI.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Synthetic validation stage
        run: python -m src.cli validate --quick

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: results/
          if-no-files-found: error
